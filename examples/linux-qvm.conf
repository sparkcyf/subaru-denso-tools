# A lab configuration: one vCPU, serial console, one Linux root disk.
# /dev/hda is the entire disposable SD image, with ext4 at offset zero.
# No QNX filesystem is exported to the guest.
system blog_linux
logger error stdout
logger warn stdout
logger info stdout
acpi generate

pass loc 0x0,$asinfo_length{linuxram_low},m=$asinfo_start{linuxram_low}
reserve loc 0x7afe0000,0x20000
pass loc 0x100000000,$asinfo_length{linuxram_high},m=$asinfo_start{linuxram_high}

cpu
sched 11r
runmask 2,3

load /scripts/bzImage
cmdline "root=/dev/vda rootfstype=ext4 rootwait rw init=/bin/sh console=ttyS0,115200n8"

vdev ioapic
    loc 0xf8000000
    intr apic
    name myioapic

vdev ser8250
    hostdev /dev/ser2
    loc io:0x3f8
    intr myioapic:4

vdev timer8254
    loc io:0x40
    intr myioapic:0

vdev mc146818
    loc io:0x70
    reg 0x0b,0x02

vdev hpet
    loc 0xf8008000
    frequency 14318180
    intr myioapic:0,myioapic:8,myioapic:10,myioapic:11,myioapic:12,myioapic:13

vdev 8259
    loc io:0x20

vdev 8259
    loc io:0xa0

vdev virtio-blk
    hostdev /dev/hda
